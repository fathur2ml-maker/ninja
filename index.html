
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NINJA CLASH - Ultimate Battle</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090e1b;color:white;
  font-family:Arial,sans-serif;text-align:center;
  user-select:none;-webkit-user-select:none;
}
header{padding:12px 8px}
h1{margin:5px;color:#ffc857;letter-spacing:3px}
p{margin:6px}
main{max-width:950px;margin:auto;padding:8px}
.panel{
  background:#152238;padding:14px;
  border-radius:14px;margin-bottom:12px;
  border:1px solid #334963;
}
select,button{
  padding:12px;border-radius:9px;
  border:1px solid #536780;
  background:#263b58;color:white;
  font-weight:bold;margin:4px;
}
button{cursor:pointer;touch-action:none}
button:active{transform:scale(.94);filter:brightness(1.3)}
.start{background:#bd7b16;color:white;width:90%;font-size:17px}
#gameArea{display:none}
#arena{
  display:block;width:100%;height:auto;
  background:#18283a;border:2px solid #ffc857;
  border-radius:10px;touch-action:none;
}
.stats{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;text-align:left;
}
.health{
  height:17px;background:#3b3b3b;
  border-radius:20px;overflow:hidden;
}
.fill{height:100%;width:100%;transition:width .15s}
#playerHP{background:#20dc87}
#enemyHP{background:#e43e52}
.energy{
  height:8px;background:#444;border-radius:20px;
  overflow:hidden;margin-top:5px;
}
.energy div{height:100%;background:#36aaff;width:0%}
.name{font-weight:bold;margin-bottom:5px}
#message{color:#ffc857;min-height:24px;font-weight:bold}
.controls{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:7px;margin-top:12px;
}
.controls button{
  min-height:58px;font-size:17px;
  border:1px solid #71849b;
}
.move{background:#354b66}
.attack{background:#a52d43}
.skill{background:#176ba7}
.ultimate{background:#a56813}
.jump{background:#59449c}
.small{font-size:12px;color:#b7c4d5}
#restart{background:#a56813}
@media(min-width:650px){
  .controls{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>

<body>

<header>
  <h1>⚔ NINJA CLASH</h1>
  <p>ULTIMATE BATTLE</p>
  <div class="small">2D NINJA FIGHTING GAME</div>
</header>

<main>

<div class="panel" id="menu">
  <h3>PILIH NINJA KAMU</h3>
  <select id="character">
    <option value="Raiko">Raiko - Ninja Petir</option>
    <option value="Kage">Kage - Ninja Bayangan</option>
    <option value="Hana">Hana - Ninja Api</option>
    <option value="Taro">Taro - Ninja Batu</option>
  </select>

  <h3>PILIH ARENA</h3>
  <select id="arenaSelect">
    <option value="forest">Hutan Ninja</option>
    <option value="dojo">Dojo Bulan</option>
    <option value="lava">Lembah Lava</option>
    <option value="snow">Puncak Salju</option>
  </select>

  <h3>TINGKAT KESULITAN</h3>
  <select id="difficulty">
    <option value="easy">Mudah</option>
    <option value="normal" selected>Normal</option>
    <option value="hard">Sulit</option>
  </select>

  <br>
  <button class="start" onclick="startGame()">⚔ MULAI BATTLE</button>

  <p class="small">
    Kalahkan musuh AI dan gunakan ultimate untuk memenangkan pertarungan!
  </p>
</div>

<div id="gameArea">

  <div class="panel">
    <div class="stats">
      <div>
        <div class="name" id="playerName">PEMAIN</div>
        <div class="health"><div class="fill" id="playerHP"></div></div>
        <div class="energy"><div id="playerEnergy"></div></div>
        <p id="playerValue" class="small">100 HP</p>
      </div>

      <div>
        <div class="name" id="enemyName">MUSUH AI</div>
        <div class="health"><div class="fill" id="enemyHP"></div></div>
        <div class="energy"><div id="enemyEnergy"></div></div>
        <p id="enemyValue" class="small">100 HP</p>
      </div>
    </div>
  </div>

  <canvas id="arena" width="900" height="450"></canvas>

  <div class="panel">
    <div id="message">BATTLE DIMULAI!</div>

    <div class="controls">
      <button class="move" id="left">◀</button>
      <button class="move" id="right">▶</button>
      <button class="jump" id="jump">▲ LOMPAT</button>
      <button class="attack" id="attack">A<br><small>SERANG</small></button>
      <button class="skill" id="skill1">S<br><small>SKILL 1</small></button>
      <button class="skill" id="skill2">D<br><small>SKILL 2</small></button>
      <button class="ultimate" id="ultimate">U<br><small>ULTIMATE</small></button>
    </div>

    <p class="small">
      Gerakkan ninja, serang musuh, dan kumpulkan energi untuk ultimate.
    </p>

    <button id="restart" onclick="startGame()">↻ MAIN LAGI</button>
    <button onclick="backToMenu()">MENU UTAMA</button>
  </div>
</div>

</main>

<script>
const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const ground = 365;

const characters = {
  Raiko:{color:"#f1c40f",dark:"#a97809",hp:110,damage:12,speed:4.4,skill:"Petir"},
  Kage:{color:"#9b59b6",dark:"#512b72",hp:100,damage:14,speed:5,skill:"Bayangan"},
  Hana:{color:"#ff6347",dark:"#a52d24",hp:95,damage:16,speed:4.6,skill:"Api"},
  Taro:{color:"#4caf50",dark:"#205c34",hp:130,damage:10,speed:3.7,skill:"Batu"}
};

const arenas = {
  forest:{top:"#183d42",bottom:"#284b35"},
  dojo:{top:"#34314c",bottom:"#68523e"},
  lava:{top:"#491b21",bottom:"#a33b20"},
  snow:{top:"#7896b0",bottom:"#d4e4ed"}
};

let player, enemy;
let running = false;
let lastTime = 0;
let keys = {};
let effects = [];
let particles = [];
let selectedArena = "forest";
let difficulty = "normal";
let audioCtx = null;
let winner = "";

function sound(freq=300,duration=.1,type="sine"){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    gain.gain.setValueAtTime(.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function makeFighter(name,x,isPlayer){
  const c=characters[name];
  return {
    name,x,y:ground,vy:0,
    hp:c.hp,maxHP:c.hp,
    energy:0,
    damage:c.damage,
    speed:c.speed,
    color:c.color,dark:c.dark,
    isPlayer,
    facing:isPlayer?1:-1,
    onGround:true,
    attackCD:0,
    skillCD:0,
    skill2CD:0,
    ultimateCD:0,
    hurt:0,
    attackAnim:0,
    special:0,
    aiTimer:0
  };
}

function startGame(){
  const selected=document.getElementById("character").value;
  selectedArena=document.getElementById("arenaSelect").value;
  difficulty=document.getElementById("difficulty").value;

  player=makeFighter(selected,190,true);

  const enemies=Object.keys(characters).filter(n=>n!==selected);
  const enemyName=enemies[Math.floor(Math.random()*enemies.length)];
  enemy=makeFighter(enemyName,710,false);

  if(difficulty==="hard"){
    enemy.hp=enemy.maxHP=Math.round(enemy.maxHP*1.2);
    enemy.damage*=1.2;
    enemy.speed*=1.15;
  }
  if(difficulty==="easy"){
    enemy.damage*=.7;
    enemy.speed*=.8;
  }

  effects=[];
  particles=[];
  winner="";
  running=true;

  document.getElementById("menu").style.display="none";
  document.getElementById("gameArea").style.display="block";
  document.getElementById("playerName").textContent=selected.toUpperCase();
  document.getElementById("enemyName").textContent="AI: "+enemyName.toUpperCase();
  document.getElementById("message").textContent="BATTLE DIMULAI!";

  sound(500,.15);
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function backToMenu(){
  running=false;
  document.getElementById("gameArea").style.display="none";
  document.getElementById("menu").style.display="block";
}

function say(text){
  document.getElementById("message").textContent=text;
}

function distance(a,b){
  return Math.abs(a.x-b.x);
}

function damage(target,amount){
  if(target.hp<=0)return;
  target.hp=Math.max(0,target.hp-amount);
  target.hurt=.2;
  target.energy=Math.min(100,target.energy+8);
  sound(110,.12,"sawtooth");

  for(let i=0;i<8;i++){
    particles.push({
      x:target.x,y:target.y-55,
      vx:(Math.random()-.5)*7,
      vy:-Math.random()*5,
      life:.5,
      color:"#ffcf55"
    });
  }

  if(target.hp<=0){
    running=false;
    winner=target.isPlayer?"AI MENANG!":"KAMU MENANG!";
    say(winner);
    sound(90,.5,"triangle");
  }
}

function hit(attacker,target,amount,range){
  if(distance(attacker,target)<range){
    damage(target,amount);
    attacker.energy=Math.min(100,attacker.energy+12);
    return true;
  }
  return false;
}

function attack(){
  if(!running||player.attackCD>0)return;
  player.attackCD=.38;
  player.attackAnim=.2;
  sound(250,.08,"square");
  hit(player,enemy,player.damage,105);
  say("SERANGAN BIASA!");
}

function skillOne(){
  if(!running||player.skillCD>0)return;
  if(player.energy<15){say("ENERGI BELUM CUKUP!");return;}
  player.energy-=15;
  player.skillCD=2.5;
  player.special=.35;

  const names={
    Raiko:"PETIR MENYAMBAR!",
    Kage:"BAYANGAN GELAP!",
    Hana:"SEMBURAN API!",
    Taro:"BATU MENGHANTAM!"
  };

  say(names[player.name]);
  sound(600,.3,"sawtooth");

  if(distance(player,enemy)<330){
    hit(player,enemy,player.damage*2.2,340);
  }
  effects.push({x:player.x+player.facing*90,y:ground-55,life:.5,color:player.color,size:100});
}

function skillTwo(){
  if(!running||player.skill2CD>0)return;
  if(player.energy<25){say("ENERGI BELUM CUKUP!");return;}

  player.energy-=25;
  player.skill2CD=4;
  player.special=.4;

  player.x+=player.facing*130;
  player.x=Math.max(50,Math.min(W-50,player.x));

  say("SHADOW DASH!");
  sound(450,.2,"triangle");

  hit(player,enemy,player.damage*1.7,130);
  effects.push({x:player.x,y:ground-45,life:.5,color:"#ffffff",size:80});
}

function ultimate(){
  if(!running||player.ultimateCD>0)return;
  if(player.energy<100){say("ENERGI ULTIMATE BELUM PENUH!");return;}

  player.energy=0;
  player.ultimateCD=8;
  player.special=.8;

  say("⚡ ULTIMATE ATTACK!");
  sound(850,.5,"sawtooth");

  if(distance(player,enemy)<500){
    hit(player,enemy,player.damage*5,510);
  }

  effects.push({x:player.x,y:ground-65,life:1,color:"#ffd34e",size:280});
}

function jump(){
  if(!running||!player.onGround)return;
  player.vy=-12;
  player.onGround=false;
  sound(350,.08);
}

function aiUpdate(dt){
  if(!running)return;

  const d=distance(enemy,player);
  enemy.facing=player.x>enemy.x?-1:1;

  enemy.aiTimer-=dt;

  if(d>85){
    enemy.x+=enemy.facing*enemy.speed*.75;
  }else if(enemy.aiTimer<=0){
    enemy.aiTimer=difficulty==="hard"?.6:1.05;
    enemy.attackAnim=.2;
    damage(player,enemy.damage);
    say("MUSUH AI MENYERANG!");
    enemy.energy=Math.min(100,enemy.energy+14);
  }

  if(d<280&&enemy.energy>=25&&enemy.skillCD<=0){
    enemy.energy-=25;
    enemy.skillCD=4;
    damage(player,enemy.damage*1.5);
    say("AI MENGGUNAKAN SKILL!");
    effects.push({x:enemy.x,y:ground-55,life:.5,color:enemy.color,size:100});
  }

  if(enemy.energy>=100&&enemy.ultimateCD<=0&&d<400){
    enemy.energy=0;
    enemy.ultimateCD=8;
    damage(player,enemy.damage*3);
    say("AI MENGGUNAKAN ULTIMATE!");
    effects.push({x:enemy.x,y:ground-60,life:1,color:"#ff4545",size:220});
  }
}

function updateFighter(f,dt){
  f.attackCD=Math.max(0,f.attackCD-dt);
  f.skillCD=Math.max(0,f.skillCD-dt);
  f.skill2CD=Math.max(0,f.skill2CD-dt);
  f.ultimateCD=Math.max(0,f.ultimateCD-dt);
  f.hurt=Math.max(0,f.hurt-dt);
  f.attackAnim=Math.max(0,f.attackAnim-dt);
  f.special=Math.max(0,f.special-dt);

  f.vy+=30*dt;
  f.y+=f.vy*dt;

  if(f.y>=ground){
    f.y=ground;
    f.vy=0;
    f.onGround=true;
  }

  f.x=Math.max(45,Math.min(W-45,f.x));
}

function update(dt){
  if(!running)return;

  if(keys.left)player.x-=player.speed*60*dt;
  if(keys.right)player.x+=player.speed*60*dt;

  player.facing=enemy.x>player.x?1:-1;

  updateFighter(player,dt);
  updateFighter(enemy,dt);
  aiUpdate(dt);

  effects.forEach(e=>e.life-=dt);
  effects=effects.filter(e=>e.life>0);

  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.2;
    p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);

  document.getElementById("playerHP").style.width=
    (player.hp/player.maxHP*100)+"%";
  document.getElementById("enemyHP").style.width=
    (enemy.hp/enemy.maxHP*100)+"%";
  document.getElementById("playerEnergy").style.width=
    player.energy+"%";
  document.getElementById("enemyEnergy").style.width=
    enemy.energy+"%";

  document.getElementById("playerValue").textContent=
    Math.ceil(player.hp)+" HP | "+player.energy+" ENERGY";
  document.getElementById("enemyValue").textContent=
    Math.ceil(enemy.hp)+" HP";
}

function drawBackground(){
  const a=arenas[selectedArena];

  const gradient=ctx.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,a.top);
  gradient.addColorStop(1,a.bottom);
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  // Langit dan matahari
  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.beginPath();
  ctx.arc(740,85,45,0,Math.PI*2);
  ctx.fill();

  // Siluet pepohonan / bangunan
  for(let i=0;i<10;i++){
    const x=i*105;
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.fillRect(x,210,35,155);
    ctx.beginPath();
    ctx.moveTo(x-35,220);
    ctx.lineTo(x+17,105+(i%3)*20);
    ctx.lineTo(x+70,220);
    ctx.fill();
  }

  // Tanah
  ctx.fillStyle=selectedArena==="snow"?"#dce8ec":
    selectedArena==="lava"?"#50231e":
    selectedArena==="dojo"?"#76583b":"#243e2a";
  ctx.fillRect(0,ground,W,H-ground);

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.fillRect(0,ground,W,4);

  // Dekorasi tanah
  for(let i=0;i<40;i++){
    ctx.fillStyle="rgba(255,255,255,.08)";
    ctx.fillRect(i*25,ground+30+(i%4)*12,12,3);
  }
}

function drawFighter(f){
  const x=f.x;
  const y=f.y;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(f.facing,1);

  // Bayangan
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0,3,37,9,0,0,Math.PI*2);
  ctx.fill();

  if(f.hurt>0)ctx.globalAlpha=.55;

  // Kaki
  ctx.fillStyle=f.dark;
  ctx.fillRect(-20,-38,15,37);
  ctx.fillRect(7,-38,15,37);

  // Sepatu
  ctx.fillStyle="#171b27";
  ctx.fillRect(-23,-7,20,8);
  ctx.fillRect(5,-7,20,8);

  // Badan
  ctx.fillStyle=f.color;
  ctx.fillRect(-25,-90,50,55);

  // Sabuk
  ctx.fillStyle="#25202a";
  ctx.fillRect(-25,-48,50,8);

  // Tangan
  ctx.fillStyle=f.dark;
  ctx.fillRect(-36,-83,13,40);
  ctx.fillRect(23,-83,13,40);

  // Kepala
  ctx.fillStyle="#e9b995";
  ctx.beginPath();
  ctx.arc(0,-108,23,0,Math.PI*2);
  ctx.fill();

  // Rambut
  ctx.fillStyle=f.dark;
  ctx.beginPath();
  ctx.moveTo(-23,-113);
  ctx.lineTo(-24,-140);
  ctx.lineTo(-8,-129);
  ctx.lineTo(0,-145);
  ctx.lineTo(11,-128);
  ctx.lineTo(25,-138);
  ctx.lineTo(22,-107);
  ctx.closePath();
  ctx.fill();

  // Ikat kepala
  ctx.fillStyle="#d5d6dc";
  ctx.fillRect(-22,-119,44,8);
  ctx.fillStyle="#252a35";
  ctx.fillRect(-5,-119,10,8);

  // Mata
  ctx.fillStyle="#161616";
  ctx.fillRect(8,-109,5,4);

  // Tangan menyerang
  if(f.attackAnim>0){
    ctx.fillStyle="#f0c6a5";
    ctx.fillRect(26,-78,35,13);
  }

  ctx.restore();

  // Nama karakter
  ctx.fillStyle="white";
  ctx.font="bold 15px Arial";
  ctx.textAlign="center";
  ctx.fillText(f.name,x,y-155);
}

function drawEffects(){
  effects.forEach(e=>{
    ctx.save();
    ctx.globalAlpha=Math.max(0,e.life);
    ctx.strokeStyle=e.color;
    ctx.lineWidth=8;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size*(1-e.life*.4),0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });

  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,7,7);
    ctx.globalAlpha=1;
  });
}

function draw(){
  drawBackground();

  // Garis tengah arena
  ctx.strokeStyle="rgba(255,255,255,.12)";
  ctx.setLineDash([10,10]);
  ctx.beginPath();
  ctx.moveTo(W/2,ground-10);
  ctx.lineTo(W/2,ground+80);
  ctx.stroke();
  ctx.setLineDash([]);

  drawFighter(player);
  drawFighter(enemy);
  drawEffects();

  if(!running&&winner){
    ctx.fillStyle="rgba(0,0,0,.65)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffc857";
    ctx.font="bold 46px Arial";
    ctx.textAlign="center";
    ctx.fillText(winner,W/2,H/2);
    ctx.font="20px Arial";
    ctx.fillStyle="white";
    ctx.fillText("Tekan MAIN LAGI untuk bermain",W/2,H/2+45);
  }
}

function loop(time){
  if(!running&&winner){
    draw();
    return;
  }

  const dt=Math.min((time-lastTime)/1000,.04);
  lastTime=time;

  update(dt);
  draw();

  if(running)requestAnimationFrame(loop);
}

// Kontrol keyboard
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(["arrowleft","arrowright"," ","arrowup"].includes(k))e.preventDefault();

  if(k==="arrowleft"||k==="a")keys.left=true;
  if(k==="arrowright"||k==="d")keys.right=true;
  if(k==="arrowup"||k==="w")jump();

  if(k==="j")attack();
  if(k==="k")skillOne();
  if(k==="l")skillTwo();
  if(k==="u")ultimate();
});

document.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a")keys.left=false;
  if(k==="arrowright"||k==="d")keys.right=false;
});

// Kontrol sentuh
function holdButton(id,key){
  const btn=document.getElementById(id);

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
    btn.setPointerCapture(e.pointerId);
  });

  function release(e){
    keys[key]=false;
  }

  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("lostpointercapture",release);
}

holdButton("left","left");
holdButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

document.getElementById("attack").addEventListener("pointerdown",e=>{
  e.preventDefault();
  attack();
});

document.getElementById("skill1").addEventListener("pointerdown",e=>{
  e.preventDefault();
  skillOne();
});

document.getElementById("skill2").addEventListener("pointerdown",e=>{
  e.preventDefault();
  skillTwo();
});

document.getElementById("ultimate").addEventListener("pointerdown",e=>{
  e.preventDefault();
  ultimate();
});
</script>

</body>
</html>
